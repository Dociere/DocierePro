name: Publish Official Release

# 1. Trigger only on version tags (e.g., v1.0.0, v0.3.1)
on:
  push:
    tags:
      - "v*"

# 2. Explicitly grant permission to write releases
permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
