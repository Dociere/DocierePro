<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DocierePro</title>

    <!--Inter Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--Playfair Display Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        font-family: "Inter", sans-serif;
      }

      /* splash container */

      .splash {
        width: 380px;
        height: 220px;
        background: white;
        border-radius: 14px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px;
        animation: fadeIn 0.7s ease;
      }

      /* logo */

      .logo img {
        width: 58px;
        margin-bottom: 10px;
      }

      /* title */

      .title {
        font-size: 22px;
        font-weight: 600;
        color: #111;
        margin-bottom: 6px;
        font-family: inter;
      }

      /* tagline */

      .tagline {
        font-size: 14px;
        color: #444;
        margin-bottom: 18px;
        font-family: playfair-display;
        font-style: italic;
      }

      /* progress bar container */

      .progress {
        width: 260px;
        height: 4px;
        background: #e5e5e5;
        overflow: hidden;
        position: relative;
        border-radius: 3px;
      }

      /* sliding loader */

      .bar {
        position: absolute;
        height: 100%;
        width: 30%;
        background: black;
        animation: slide 1.1s infinite ease-in-out;
      }

      /* footer message */

      .subtext {
        font-size: 12px;
        color: #9a9a9a;
        margin-top: 14px;
      }

      /* animations */

      @keyframes slide {
        0% {
          left: -30%;
        }
        100% {
          left: 100%;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const isFirstRun = urlParams.get("firstRun") === "true";

        const tagline = document.querySelector(".tagline");
        const subtext = document.querySelector(".subtext");

        if (isFirstRun) {
          tagline.innerText = "Setting up LaTeX...";
          subtext.innerText =
            "Installing required packages (may take a minute)";
        } else {
          tagline.innerText = "Opening your workspace";
          subtext.innerText = "Loading project environment";
        }
      });
    </script>
  </head>

  <body>
    <div class="splash">
      <div class="logo">
        <img src="dociereLogo.png" />
      </div>

      <div class="title">DocierePro</div>

      <div class="tagline">Starting application</div>

      <div class="progress">
        <div class="bar"></div>
      </div>

      <div class="subtext"></div>
    </div>
  </body>
</html>
